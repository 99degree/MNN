name: Android AAR Release (All Backends - Continuous)

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 3.5.1). Will create tag v{version} and build.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  android-aar-build:
    runs-on: ubuntu-latest
    env:
      AAR_NAME: MNN-Android
      QNN_LIBS_URL: https://meta.alicdn.com/data/mnn/libs/qnn_inc_libs_2_37.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0   # full history needed for tagging

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ -n "${GITHUB_REF##*/}" ]] && [[ "${GITHUB_REF##*/}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION=${GITHUB_REF##*/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=3.5.1" >> $GITHUB_OUTPUT
          fi

      # ============================================================
      # Android SDK & NDK Setup
      # ============================================================
      - name: Setup Android SDK & NDK
        run: |
          set -euo pipefail

          # ---- 1. Locate Android SDK ----
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            echo "Using pre-installed Android SDK at: $ANDROID_HOME"
          elif [ -d /usr/local/lib/android/sdk ]; then
            ANDROID_HOME=/usr/local/lib/android/sdk
            echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
            echo "Found Android SDK at: $ANDROID_HOME"
          else
            echo "ERROR: No Android SDK found. Ensure android-actions/setup-android is used."
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

          # ---- 2. Ensure cmdline-tools (sdkmanager) ----
          SDKMANAGER=""
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" \
            "$ANDROID_HOME/tools/bin/sdkmanager" \
            "$ANDROID_HOME/tools/bin/sdkmanager.bat"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found. Installing cmdline-tools..."
            CMDLINE_TOOLS_ZIP="$ANDROID_HOME/cmdline-tools.zip"
            CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            curl -fSL --retry 3 -o "$CMDLINE_TOOLS_ZIP" "$CMDLINE_TOOLS_URL"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            unzip -q "$CMDLINE_TOOLS_ZIP" -d "$ANDROID_HOME/cmdline-tools"
            if [ -d "$ANDROID_HOME/cmdline-tools/cmdline-tools" ]; then
              mv "$ANDROID_HOME/cmdline-tools/cmdline-tools"/* "$ANDROID_HOME/cmdline-tools/"
              rmdir "$ANDROID_HOME/cmdline-tools/cmdline-tools"
            fi
            rm -f "$CMDLINE_TOOLS_ZIP"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMANAGER" ]; then
              echo "ERROR: Failed to install cmdline-tools"
              ls -la "$ANDROID_HOME/cmdline-tools/" 2>/dev/null || true
              exit 1
            fi
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> $GITHUB_ENV
          echo "Using sdkmanager: $SDKMANAGER"

          # ---- 3. Accept licenses ---
          yes | "$SDKMANAGER" --licenses --sdk_root="$ANDROID_HOME" 2>/dev/null || true

          # ---- 4. Install NDK ---
          NDK_VERSION="25.2.9519653"  # NDK r25c
          NDK_DIR="$ANDROID_HOME/ndk/$NDK_VERSION"

          if [ -d "$NDK_DIR" ] && [ -f "$NDK_DIR/build/cmake/android.toolchain.cmake" ]; then
            echo "NDK $NDK_VERSION already installed at: $NDK_DIR"
          else
            echo "Installing NDK $NDK_VERSION..."
            echo "y" | "$SDKMANAGER" --install "ndk;$NDK_VERSION" --sdk_root="$ANDROID_HOME"
            if [ ! -f "$NDK_DIR/build/cmake/android.toolchain.cmake" ]; then
              echo "ERROR: NDK installation failed — toolchain not found at $NDK_DIR"
              exit 1
            fi
          fi
          echo "ANDROID_NDK=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
          echo "NDK installed at: $NDK_DIR"

          # ---- 5. Install platform & build-tools ---
          PLATFORM="platforms;android-34"
          BUILD_TOOLS="build-tools;34.0.0"
          echo "Installing $PLATFORM ..."
          echo "y" | "$SDKMANAGER" --install "$PLATFORM" --sdk_root="$ANDROID_HOME" 2>/dev/null || echo "Already installed or unavailable"
          echo "Installing $BUILD_TOOLS ..."
          echo "y" | "$SDKMANAGER" --install "$BUILD_TOOLS" --sdk_root="$ANDROID_HOME" 2>/dev/null || echo "Already installed or unavailable"

          # Verify
          echo ""
          echo "=== Environment ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          echo "ANDROID_NDK=$NDK_DIR"
          echo "JDK: $(java -version 2>&1 | head -1)"
          echo "CMake: $(cmake --version 2>&1 | head -1)"

      # ============================================================
      # Prepare QNN SDK dependencies
      # ============================================================
      - name: Download and setup QNN SDK
        run: |
          set -x
          # Define QNN 3rdParty directory (used throughout the workflow
          QNN_3RD_PARTY="source/backend/qnn/3rdParty"
          mkdir -p "${QNN_3RD_PARTY}/include"
          mkdir -p "${QNN_3RD_PARTY}/lib"
          echo "Downloading QNN SDK from ${QNN_LIBS_URL}..."
          mkdir -p $HOME/build_qnn_temp
          QNN_ZIP="$HOME/build_qnn_temp/qnn_sdk.zip"
          # Retry download up to 5 times with exponential backoff
          for i in 1 2 3 4 5; do
            echo "Download attempt $i/5..."
            if curl -fL --retry 5 --retry-delay 10 --max-time 300 -o "${QNN_ZIP}" "${QNN_LIBS_URL}"; then
              echo "Download successful"
              break
            else
              echo "Download attempt $i failed, retrying in 15 seconds..."
              sleep 15
            fi
            if [ $i -eq 5 ]; then
              echo "ERROR: Failed to download QNN SDK after 5 attempts"
              exit 1
            fi
          done

          echo "Extracting QNN SDK..."
          QNN_TMP="$HOME/build_qnn_temp/extracted"
          mkdir -p "${QNN_TMP}"
          unzip -q "${QNN_ZIP}" -d "${QNN_TMP}"

          # Sync to ensure files are written to disk
          sync

          echo "=== Debug: Listing extracted contents ==="
          find "${QNN_TMP}" -type f -name "*.h" | head -20

          # Find the include directory (handles nested top-level dir)
          INCLUDE_DIR=$(find "${QNN_TMP}" -type d -name "include" ! -path "*/__MACOSX/*" | head -1)
          if [ -z "${INCLUDE_DIR}" ]; then
            echo "ERROR: Failed to find 'include' directory in QNN SDK archive"
            echo "=== Debug: Full extracted structure ==="
            find "${QNN_TMP}" -type f | head -50
            exit 1
          fi
          EXTRACTED_QNN_DIR=$(dirname "${INCLUDE_DIR}")
          echo "QNN SDK extracted to: ${EXTRACTED_QNN_DIR}"

          echo "=== Debug: Found include dir: ${INCLUDE_DIR} ==="
          echo "=== Debug: QNN directory structure ==="
          find "${EXTRACTED_QNN_DIR}/include" -type f -name "*.h" | head -20

          # Verify QnnInterface.h exists
          if [ ! -f "${EXTRACTED_QNN_DIR}/include/QNN/QnnInterface.h" ] && [ ! -f "${EXTRACTED_QNN_DIR}/include/QnnInterface.h" ]; then
            echo "ERROR: QnnInterface.h not found in extracted SDK"
            exit 1
          fi

          # Copy headers to 3rdParty include/QNN/ directory (CMake expects include/QNN/)
          mkdir -p "${QNN_3RD_PARTY}/include/QNN"
          if [ -d "${EXTRACTED_QNN_DIR}/include/QNN" ]; then
            echo "=== Copying QNN headers from QNN subdirectory ==="
            cp -rv "${EXTRACTED_QNN_DIR}/include/QNN/"* "${QNN_3RD_PARTY}/include/QNN/"
          else
            echo "=== Copying QNN headers from include root ==="
            cp -rv "${EXTRACTED_QNN_DIR}/include/"* "${QNN_3RD_PARTY}/include/QNN/"
          fi

          echo "=== Debug: Copied headers ==="
          find "${QNN_3RD_PARTY}/include" -type f -name "*.h" | head -20

          # Determine lib source dir (jniLibs or lib)
          SOURCE_LIBS="${EXTRACTED_QNN_DIR}/jniLibs"
          if [ ! -d "${SOURCE_LIBS}" ]; then
            SOURCE_LIBS="${EXTRACTED_QNN_DIR}/lib"
          fi
          if [ -d "${SOURCE_LIBS}" ]; then
            cp -r "${SOURCE_LIBS}"/* "${QNN_3RD_PARTY}/lib/"
          else
            echo "WARNING: No lib/jniLibs found in QNN SDK"
          fi

          # Compute absolute path and export
          QNN_SDK_ROOT_PATH="$(cd "${QNN_3RD_PARTY}" && pwd)"
          echo "QNN_SDK_ROOT=${QNN_SDK_ROOT_PATH}" >> $GITHUB_ENV
          echo "QNN SDK root set to: ${QNN_SDK_ROOT_PATH}"

          echo "=== QNN 3rdParty structure ==="
          find "${QNN_3RD_PARTY}" -type f | head -20

      # ========== Build arm64-v8a with all backends ==========
      - name: Build native libs (arm64-v8a)
        run: |
          mkdir -p build_android/arm64-v8a
          cd build_android/arm64-v8a

          # Check if ninja is available and use it for faster builds
          if command -v ninja >/dev/null 2>&1; then
            echo "Using ninja for faster build..."
            cmake ../../ -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_ABI="arm64-v8a" \
            -DANDROID_STL=c++_shared \
            -DANDROID_NATIVE_API_LEVEL=android-21 \
            -DANDROID_TOOLCHAIN=clang \
            -DMNN_USE_LOGCAT=ON \
            -DMNN_USE_SSE=OFF \
            -DMNN_OPENCL=ON \
            -DMNN_VULKAN=ON \
            -DMNN_ARM82=ON \
            -DMNN_NNAPI=ON \
            -DMNN_QNN=ON \
            -DQNN_SDK_ROOT=$QNN_SDK_ROOT_PATH \
            -DMNN_JNI=ON \
            -DMNN_BUILD_OPENCV=ON \
            -DMNN_IMGCODECS=ON \
            -DMNN_BUILD_LLM=OFF \
            -DMNN_SUPPORT_TRANSFORMER_FUSE=ON \
            -DMNN_LOW_MEMORY=ON \
            -DMNN_SUPPORT_BF16=ON \
            -DMNN_BUILD_AUDIO=ON \
            -DMNN_BUILD_DIFFUSION=OFF \
            -DLLM_SUPPORT_VISION=OFF \
            -DLLM_SUPPORT_AUDIO=OFF \
            -DMNN_BUILD_FOR_ANDROID_COMMAND=ON \
            -DMNN_SEP_BUILD=ON \
            -DMNN_BUILD_SHARED_LIBS=ON \
            -DMNN_BUILD_BENCHMARK=OFF \
            -DMNN_BUILD_TEST=OFF \
            -DMNN_BUILD_TOOLS=ON \
            -DMNN_BUILD_DEMO=OFF \
            -DNATIVE_LIBRARY_OUTPUT=. \
            -DNATIVE_INCLUDE_OUTPUT=. \
            -DCMAKE_VERBOSE_MAKEFILE=ON

            ninja -v
          else
            echo "Using make..."
            cmake ../../ \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_ABI="arm64-v8a" \
            -DANDROID_STL=c++_shared \
            -DANDROID_NATIVE_API_LEVEL=android-21 \
            -DANDROID_TOOLCHAIN=clang \
            -DMNN_USE_LOGCAT=ON \
            -DMNN_USE_SSE=OFF \
            -DMNN_OPENCL=ON \
            -DMNN_VULKAN=ON \
            -DMNN_ARM82=ON \
            -DMNN_NNAPI=ON \
            -DMNN_QNN=ON \
            -DQNN_SDK_ROOT=$QNN_SDK_ROOT_PATH \
            -DMNN_JNI=ON \
            -DMNN_BUILD_OPENCV=ON \
            -DMNN_IMGCODECS=ON \
            -DMNN_BUILD_LLM=OFF \
            -DMNN_SUPPORT_TRANSFORMER_FUSE=ON \
            -DMNN_LOW_MEMORY=ON \
            -DMNN_SUPPORT_BF16=ON \
            -DMNN_BUILD_AUDIO=ON \
            -DMNN_BUILD_DIFFUSION=OFF \
            -DLLM_SUPPORT_VISION=OFF \
            -DLLM_SUPPORT_AUDIO=OFF \
            -DMNN_BUILD_FOR_ANDROID_COMMAND=ON \
            -DMNN_SEP_BUILD=ON \
            -DMNN_BUILD_SHARED_LIBS=ON \
            -DMNN_BUILD_BENCHMARK=OFF \
            -DMNN_BUILD_TEST=OFF \
            -DMNN_BUILD_TOOLS=ON \
            -DMNN_BUILD_DEMO=OFF \
            -DNATIVE_LIBRARY_OUTPUT=. \
            -DNATIVE_INCLUDE_OUTPUT=. \
            -DCMAKE_VERBOSE_MAKEFILE=ON

            make -j$(nproc) VERBOSE=1
          fi

      # ========== Upload arm64 artifacts ==========
      - name: Upload arm64-v8a artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arm64-v8a-libs
          path: |
            build_android/arm64-v8a/*.so
            build_android/arm64-v8a/source/jni/*.so
            build_android/arm64-v8a/tools/cv/*.so
            build_android/arm64-v8a/tools/audio/*.so
            build_android/arm64-v8a/source/backend/qnn/*.so
            build_android/arm64-v8a/source/backend/vulkan/*.so
            build_android/arm64-v8a/source/backend/opencl/*.so
            build_android/arm64-v8a/source/backend/opengl/*.so
            build_android/arm64-v8a/tools/converter/*.so
            build_android/arm64-v8a/tools/converter/mnnconvert
            build_android/arm64-v8a/tools/converter/convertToStaticModel
          retention-days: 7

      # ========== Build armeabi-v7a with all backends ==========
      - name: Build native libs (armeabi-v7a)
        run: |
          mkdir -p build_android/armeabi-v7a
          cd build_android/armeabi-v7a

          # Check if ninja is available and use it for faster builds
          if command -v ninja >/dev/null 2>&1; then
            echo "Using ninja for faster build..."
            cmake ../../ -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_ABI="armeabi-v7a" \
            -DANDROID_STL=c++_shared \
            -DANDROID_NATIVE_API_LEVEL=android-21 \
            -DANDROID_TOOLCHAIN=clang \
            -DMNN_USE_LOGCAT=ON \
            -DMNN_USE_SSE=OFF \
            -DMNN_OPENCL=ON \
            -DMNN_VULKAN=ON \
            -DMNN_ARM82=OFF \
            -DMNN_NNAPI=ON \
            -DMNN_QNN=ON \
            -DQNN_SDK_ROOT=$QNN_SDK_ROOT_PATH \
            -DMNN_JNI=ON \
            -DMNN_BUILD_OPENCV=ON \
            -DMNN_IMGCODECS=ON \
            -DMNN_BUILD_LLM=OFF \
            -DMNN_SUPPORT_TRANSFORMER_FUSE=ON \
            -DMNN_LOW_MEMORY=ON \
            -DMNN_SUPPORT_BF16=ON \
            -DMNN_BUILD_AUDIO=ON \
            -DMNN_BUILD_DIFFUSION=OFF \
            -DLLM_SUPPORT_VISION=OFF \
            -DLLM_SUPPORT_AUDIO=OFF \
            -DMNN_BUILD_FOR_ANDROID_COMMAND=ON \
            -DMNN_SEP_BUILD=ON \
            -DMNN_BUILD_SHARED_LIBS=ON \
            -DMNN_BUILD_BENCHMARK=OFF \
            -DMNN_BUILD_TEST=OFF \
            -DMNN_BUILD_TOOLS=ON \
            -DMNN_BUILD_DEMO=OFF \
            -DNATIVE_LIBRARY_OUTPUT=. \
            -DNATIVE_INCLUDE_OUTPUT=. \
            -DCMAKE_VERBOSE_MAKEFILE=ON

            ninja -v
          else
            echo "Using make..."
            cmake ../../ \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_ABI="armeabi-v7a" \
            -DANDROID_STL=c++_shared \
            -DANDROID_NATIVE_API_LEVEL=android-21 \
            -DANDROID_TOOLCHAIN=clang \
            -DMNN_USE_LOGCAT=ON \
            -DMNN_USE_SSE=OFF \
            -DMNN_OPENCL=ON \
            -DMNN_VULKAN=ON \
            -DMNN_ARM82=OFF \
            -DMNN_NNAPI=ON \
            -DMNN_QNN=ON \
            -DQNN_SDK_ROOT=$QNN_SDK_ROOT_PATH \
            -DMNN_JNI=ON \
            -DMNN_BUILD_OPENCV=ON \
            -DMNN_IMGCODECS=ON \
            -DMNN_BUILD_LLM=OFF \
            -DMNN_SUPPORT_TRANSFORMER_FUSE=ON \
            -DMNN_LOW_MEMORY=ON \
            -DMNN_SUPPORT_BF16=ON \
            -DMNN_BUILD_AUDIO=ON \
            -DMNN_BUILD_DIFFUSION=OFF \
            -DLLM_SUPPORT_VISION=OFF \
            -DLLM_SUPPORT_AUDIO=OFF \
            -DMNN_BUILD_FOR_ANDROID_COMMAND=ON \
            -DMNN_SEP_BUILD=ON \
            -DMNN_BUILD_SHARED_LIBS=ON \
            -DMNN_BUILD_BENCHMARK=OFF \
            -DMNN_BUILD_TEST=OFF \
            -DMNN_BUILD_TOOLS=ON \
            -DMNN_BUILD_DEMO=OFF \
            -DNATIVE_LIBRARY_OUTPUT=. \
            -DNATIVE_INCLUDE_OUTPUT=. \
            -DCMAKE_VERBOSE_MAKEFILE=ON

            make -j$(nproc) VERBOSE=1
          fi

      # ========== Upload armv7 artifacts ==========
      - name: Upload armeabi-v7a artifacts
        uses: actions/upload-artifact@v4
        with:
          name: armeabi-v7a-libs
          path: |
            build_android/armeabi-v7a/*.so
            build_android/armeabi-v7a/source/jni/*.so
            build_android/armeabi-v7a/tools/cv/*.so
            build_android/armeabi-v7a/tools/audio/*.so
            build_android/armeabi-v7a/source/backend/qnn/*.so
            build_android/armeabi-v7a/source/backend/vulkan/*.so
            build_android/armeabi-v7a/source/backend/opencl/*.so
            build_android/armeabi-v7a/source/backend/opengl/*.so
            build_android/armeabi-v7a/tools/converter/*.so
            build_android/armeabi-v7a/tools/converter/mnnconvert
            build_android/armeabi-v7a/tools/converter/convertToStaticModel
          retention-days: 7

      - name: Download armeabi-v7a artifacts
        uses: actions/download-artifact@v4
        with:
          name: armeabi-v7a-libs
          path: build_android/armeabi-v7a

      - name: Download arm64-v8a artifacts
        uses: actions/download-artifact@v4
        with:
          name: arm64-v8a-libs
          path: build_android/arm64-v8a

      - name: package_aar
        id: package_aar
        env:
          AAR_DIR: aar_build
          AAR_NAME: MNN-Android
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # AndroidManifest.xml (required for AAR)
          mkdir -p ${AAR_DIR}
          echo '<?xml version="1.0" encoding="utf-8"?>' > ${AAR_DIR}/AndroidManifest.xml
          echo '<manifest xmlns="http://schemas.android.com/apk/res/android">' >> ${AAR_DIR}/AndroidManifest.xml
          echo '    package="com.taobao.android.mnn">' >> ${AAR_DIR}/AndroidManifest.xml
          echo '</manifest>' >> ${AAR_DIR}/AndroidManifest.xml

          # classes.jar (required, can be empty)
          mkdir -p ${AAR_DIR}/tmp_empty
          jar cf ${AAR_DIR}/classes.jar -C ${AAR_DIR}/tmp_empty .
          rm -rf ${AAR_DIR}/tmp_empty

          # R.txt (required, can be empty)
          touch ${AAR_DIR}/R.txt

          # proguard.txt (optional)
          touch ${AAR_DIR}/proguard.txt

          # Create jni directories and copy native libraries
          mkdir -p ${AAR_DIR}/jni/armeabi-v7a
          mkdir -p ${AAR_DIR}/jni/arm64-v8a

          # Copy armeabi-v7a libraries
          cp build_android/armeabi-v7a/*.so ${AAR_DIR}/jni/armeabi-v7a/ 2>/dev/null || true
          cp build_android/armeabi-v7a/source/jni/*.so ${AAR_DIR}/jni/armeabi-v7a/ 2>/dev/null || true
          cp build_android/armeabi-v7a/tools/cv/*.so ${AAR_DIR}/jni/armeabi-v7a/ 2>/dev/null || true
          cp build_android/armeabi-v7a/tools/audio/*.so ${AAR_DIR}/jni/armeabi-v7a/ 2>/dev/null || true
          cp build_android/armeabi-v7a/source/backend/qnn/*.so ${AAR_DIR}/jni/armeabi-v7a/ 2>/dev/null || true
          cp build_android/armeabi-v7a/source/backend/vulkan/*.so ${AAR_DIR}/jni/armeabi-v7a/ 2>/dev/null || true
          cp build_android/armeabi-v7a/source/backend/opencl/*.so ${AAR_DIR}/jni/armeabi-v7a/ 2>/dev/null || true
          cp build_android/armeabi-v7a/source/backend/opengl/*.so ${AAR_DIR}/jni/armeabi-v7a/ 2>/dev/null || true
          cp build_android/armeabi-v7a/tools/converter/*.so ${AAR_DIR}/jni/armeabi-v7a/ 2>/dev/null || true

          # Copy arm64-v8a libraries
          cp build_android/arm64-v8a/*.so ${AAR_DIR}/jni/arm64-v8a/ 2>/dev/null || true
          cp build_android/arm64-v8a/source/jni/*.so ${AAR_DIR}/jni/arm64-v8a/ 2>/dev/null || true
          cp build_android/arm64-v8a/tools/cv/*.so ${AAR_DIR}/jni/arm64-v8a/ 2>/dev/null || true
          cp build_android/arm64-v8a/tools/audio/*.so ${AAR_DIR}/jni/arm64-v8a/ 2>/dev/null || true
          cp build_android/arm64-v8a/source/backend/qnn/*.so ${AAR_DIR}/jni/arm64-v8a/ 2>/dev/null || true
          cp build_android/arm64-v8a/source/backend/vulkan/*.so ${AAR_DIR}/jni/arm64-v8a/ 2>/dev/null || true
          cp build_android/arm64-v8a/source/backend/opencl/*.so ${AAR_DIR}/jni/arm64-v8a/ 2>/dev/null || true
          cp build_android/arm64-v8a/source/backend/opengl/*.so ${AAR_DIR}/jni/arm64-v8a/ 2>/dev/null || true
          cp build_android/arm64-v8a/tools/converter/*.so ${AAR_DIR}/jni/arm64-v8a/ 2>/dev/null || true

          # Create AAR (jar = zip with .aar extension)
          FINAL_AAR="${AAR_NAME}-${VERSION}.aar"
          cd ${AAR_DIR}
          jar cf ${FINAL_AAR} AndroidManifest.xml classes.jar R.txt proguard.txt jni/
          cd ..

          echo ""
          echo "=== AAR created ==="
          ls -lh ${AAR_DIR}/${FINAL_AAR}

          # Copy to workspace root for upload
          cp ${AAR_DIR}/${FINAL_AAR} ./
          echo ""
          echo "All-in-one AAR ready: ${FINAL_AAR}"
          ls -lh ${AAR_DIR}/${FINAL_AAR}

          echo "aar_path=${FINAL_AAR}" >> $GITHUB_OUTPUT

      - name: Upload AAR as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MNN-Android-${{ steps.version.outputs.VERSION }}.aar
          path: ${{ steps.package_aar.outputs.aar_path }}
          retention-days: 30

      - name: Upload AAR to GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.package_aar.outputs.aar_path }}
          name: MNN Android ${{ steps.version.outputs.VERSION }} (All Backends)
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
