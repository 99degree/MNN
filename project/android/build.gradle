buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
    }
}

repositories {
    google()
    mavenCentral()
}

apply plugin: 'com.android.library'

android {
    namespace = "com.taobao.android.mnn"
    compileSdk = 34

    defaultConfig {
        minSdk = 21
        targetSdk = 34
        versionCode = 1
        versionName project.version != 'unspecified' ? project.version : "3.6.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_ARM_NEON=TRUE",
                    "-DANDROID_PLATFORM=android-21",
                    "-DMNN_OPENCL=true",
                    "-DMNN_OPENGL=true",
                    "-DMNN_VULKAN=true",
                    "-DMNN_JNI=TRUE",
                    "-DANDROID_STL=c++_shared",
                    "-DMNN_BUILD_FOR_ANDROID_COMMAND=true",
                    "-DMNN_LOW_MEMORY=ON",
                    "-DMNN_BUILD_DIFFUSION=OFF",
                    "-DMNN_BUILD_OPENCV=OFF",
                    "-DMNN_IMGCODECS=ON",
                    "-DMNN_SEP_BUILD=OFF",
                    "-DMNN_SUPPORT_TRANSFORMER_FUSE=ON"
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug {
            debuggable = true
        }
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path = "../../CMakeLists.txt"
            version = "3.22.1"
        }
    }

    sourceSets {
        getByName("main") {
            java.srcDirs("src/main/java")
            jniLibs.srcDirs("src/main/jniLibs")
        }
    }
}

dependencies {
    // No external deps — pure JNI wrapper
}

apply from: "nativepub.gradle"
